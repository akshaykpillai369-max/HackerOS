<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HackerOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="boot-screen">

        <div class="boot-container">

            <div class="logo">
                <div class="logo-symbol">&gt;_</div>

                <h1>
                    HACKER<span>OS</span>
                </h1>
            </div>

            <p class="subtitle">
                SECURITY WORKSTATION
            </p>

            <div class="terminal">

                <p>
                    <span>&gt;</span>
                    Initializing HackerOS...
                    <strong>[OK]</strong>
                </p>

                <p>
                    <span>&gt;</span>
                    Loading kernel...
                    <strong>[OK]</strong>
                </p>

                <p>
                    <span>&gt;</span>
                    Loading security modules...
                    <strong>[OK]</strong>
                </p>

                <p>
                    <span>&gt;</span>
                    Establishing secure session...
                    <strong>[OK]</strong>
                </p>

                <p>
                    <span>&gt;</span>
                    System ready.
                </p>

            </div>

            <button id="enterButton">
                ENTER SYSTEM
            </button>

            <p class="version">
                HackerOS v1.0.0
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
