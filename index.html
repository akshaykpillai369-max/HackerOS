<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HackerOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="boot-screen">

        <div class="boot-container">

            <!-- LOGO -->
            <div class="logo">

                <div class="logo-symbol">
                    &gt;_
                </div>

                <h1>
                    HACKER<span>OS</span>
                </h1>

            </div>


            <!-- SUBTITLE -->
            <p class="subtitle">
                SECURITY WORKSTATION
            </p>


            <!-- TERMINAL -->
            <div class="terminal">

                <p class="boot-line">
                    <span class="prompt">&gt;</span>
                    <span class="message"></span>
                    <strong>[OK]</strong>
                </p>

                <p class="boot-line">
                    <span class="prompt">&gt;</span>
                    <span class="message"></span>
                    <strong>[OK]</strong>
                </p>

                <p class="boot-line">
                    <span class="prompt">&gt;</span>
                    <span class="message"></span>
                    <strong>[OK]</strong>
                </p>

                <p class="boot-line">
                    <span class="prompt">&gt;</span>
                    <span class="message"></span>
                    <strong>[OK]</strong>
                </p>

                <p class="boot-line">
                    <span class="prompt">&gt;</span>
                    <span class="message"></span>
                    <strong>[READY]</strong>
                </p>

            </div>


            <!-- ENTER BUTTON -->
            <button id="enterButton" disabled>
                ENTER SYSTEM
            </button>


            <!-- VERSION -->
            <p class="version">
                HackerOS v1.0.0
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
